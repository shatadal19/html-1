<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <input type="text">
    <input type="password">
    <input type="email">
    <input type="number">
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
    <textarea name="message" rows="4" cols="30"></textarea>
    <button>Click Me</button>
    <select>
        <option value="option1">Option 1</option>
        <option value="option2">Option 2</option>
        <option value="option3">Option 3</option>
    </select>
    <form action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Enter your message" required></textarea>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
        </select>

        <br>
        <input type="submit" value="Submit">

        <fieldset>
            <legend>Pick an option</legend>
            <label for="chitoy"> 
                <input type="radio" id="chitoy" name="pitha">
                chitoy
            </label>
            <label for="Vapa">
                <input type="radio" id="Vapa" name="pitha">
                Vapa
            </label>
            <label for="Chakuli">
                <input type="radio" id="Chakuli" name="pitha">
                Chakuli
            </label>
        </fieldset>

        <fieldset>
            <legend>Pick your favorite fruits</legend>
            <label for="apple">
                <input type="checkbox" id="apple" name="fruits" value="apple">
                Apple
            </label>
            <label for="banana">
                <input type="checkbox" id="banana" name="fruits" value="banana">
                Banana
            </label>
            <label for="orange">
                <input type="checkbox" id="orange" name="fruits" value="orange">
                Orange
            </label>

        </fieldset>
        <fieldset>
            <legend>Note here</legend>
            <textarea name="note" rows="4" cols="30"></textarea>
        </fieldset>
        <input type="reset" value="Reset">
        <input type="submit" value="Submit">

    </form>

    <!-- input elements is inline elements
     
    -->
</body>
</html>
